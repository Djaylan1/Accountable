<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Accountable">
<meta name="theme-color" content="#05091A">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Accountable</title>
<style>
:root {
  --bg:#05091A; --deep:#03060F; --s1:rgba(11,23,54,.72); --s2:#101B36; --s3:#25438A; --line:rgba(255,255,255,.12);
  --fg:#fff; --mut:#9AA6C2; --blue:#4273D1; --blue-hi:#4F80DE; --blue-lo:#3260C2; --acc:#8FB0EC; --amber:#F5B83D; --bad:#ff6b7a;
  --radius:24px;
  --ease:cubic-bezier(.2,.7,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --body:'Instrument Sans',system-ui,-apple-system,sans-serif;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); }
body {
  margin:0; color:var(--fg); font:16px/1.45 var(--body); min-height:100dvh;
  background:
    radial-gradient(1100px 620px at 50% -18%, rgba(66,115,209,.50), transparent 66%),
    radial-gradient(520px 420px at 105% 45%, rgba(37,67,138,.30), transparent 70%),
    radial-gradient(500px 360px at -10% 75%, rgba(37,67,138,.22), transparent 70%),
    var(--bg);
  background-attachment:fixed;
  padding:max(18px, env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom));
  max-width:520px; margin-inline:auto; overflow-x:hidden;
}
body::before { /* sterrenhemel */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55; animation:twinkle 6s ease-in-out infinite;
  background-image:
    radial-gradient(1px 1px at 20px 30px,#fff,transparent), radial-gradient(1px 1px at 90px 120px,rgba(255,255,255,.7),transparent),
    radial-gradient(1.5px 1.5px at 150px 60px,rgba(143,176,236,.95),transparent), radial-gradient(1px 1px at 60px 170px,rgba(255,255,255,.6),transparent),
    radial-gradient(1px 1px at 180px 150px,#fff,transparent);
  background-size:210px 210px;
}
@keyframes twinkle { 50% { opacity:.28; } }
body > * { position:relative; z-index:1; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; transition:transform .25s var(--ease), background .2s, opacity .2s, box-shadow .3s; }
button:active { transform:scale(.97); }

/* header */
.pip-logo{height:26px;width:auto;display:block;margin-bottom:14px}
.top { display:flex; align-items:flex-start; justify-content:space-between; padding-top:6px; }
.eyebrow { font:500 13px var(--body); letter-spacing:.04em; color:var(--mut); }
h1 { font:500 40px/1.05 var(--body); letter-spacing:-.025em; margin:8px 0 0; }
h1 em { font-style:normal; background:linear-gradient(90deg,#8FB0EC,#cfe0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
.icon-btn { width:46px; height:46px; border-radius:50%; background:rgba(11,23,54,.7); border:1px solid var(--line); display:grid; place-items:center; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.icon-btn svg { width:20px; height:20px; stroke:#fff; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

/* hero */
.hero { display:flex; align-items:center; gap:18px; margin:24px 0 24px; padding:20px; border-radius:var(--radius);
  background:linear-gradient(150deg, rgba(37,67,138,.45), rgba(11,23,54,.75) 60%); border:1px solid var(--line); overflow:hidden; position:relative; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
.hero::after { content:""; position:absolute; right:-50px; top:-60px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(79,128,222,.35), transparent 70%); }
.ring { width:84px; height:84px; flex:none; transform:rotate(-90deg); overflow:visible; }
.ring circle { fill:none; stroke-width:8; stroke-linecap:round; }
.ring .bg { stroke:rgba(255,255,255,.1); }
.ring .fg { stroke:url(#rg); stroke-dasharray:238.8; stroke-dashoffset:238.8; transition:stroke-dashoffset 1.2s var(--ease); filter:drop-shadow(0 0 7px rgba(66,115,209,.9)); }
.ringwrap { position:relative; width:84px; height:84px; flex:none; }
.ringnum { position:absolute; inset:0; display:grid; place-items:center; font:600 28px var(--body); letter-spacing:-.02em; }
.hero h2 { margin:0; font:500 24px/1.15 var(--body); letter-spacing:-.02em; }
.hero p { margin:5px 0 0; color:var(--mut); font-size:14px; position:relative; z-index:1; }

/* kaarten */
.cards { display:grid; gap:12px; }
.card { position:relative; display:grid; grid-template-columns:auto 1fr; gap:15px; align-items:center; padding:16px; border-radius:var(--radius);
  background:var(--s1); border:1px solid var(--line); text-align:left; width:100%; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  opacity:0; transform:translateY(18px) scale(.98); animation:enter .75s var(--ease) forwards; animation-delay:calc(var(--i) * 80ms); }
.card.open { border-color:rgba(245,184,61,.5); background:linear-gradient(160deg, rgba(245,184,61,.10), var(--s1) 55%); animation:enter .75s var(--ease) forwards, glow 2.6s ease-in-out infinite; animation-delay:calc(var(--i) * 80ms), 0s; }
.card.pop { animation:enter .01s forwards, cardpop .8s var(--spring); opacity:1; transform:none; }
@keyframes enter { to { opacity:1; transform:none; } }
@keyframes glow { 0%,100% { box-shadow:0 0 0 0 rgba(245,184,61,0); } 50% { box-shadow:0 0 30px 0 rgba(245,184,61,.18); } }
@keyframes cardpop { 0% { transform:scale(.96); box-shadow:0 0 0 0 rgba(79,128,222,.6); } 40% { transform:scale(1.025); box-shadow:0 0 44px 6px rgba(79,128,222,.4); } 100% { transform:scale(1); box-shadow:0 0 0 0 rgba(79,128,222,0); } }

.check { position:relative; width:64px; height:64px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.04); border:1.5px solid rgba(255,255,255,.18); }
.check svg { width:28px; height:28px; fill:none; stroke:var(--mut); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:30; stroke-dashoffset:30; transition:stroke-dashoffset .5s var(--ease) .1s, stroke .2s; }
.card.open .check { border-color:var(--amber); background:rgba(245,184,61,.10); }
.card.open .check::after { content:""; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--amber); animation:pulse 1.9s ease-out infinite; }
.card.open .check svg { stroke:var(--amber); stroke-dashoffset:0; }
.card.done .check { background:linear-gradient(135deg,var(--blue-lo),var(--blue-hi)); border-color:rgba(255,255,255,.3); box-shadow:0 0 30px rgba(66,115,209,.65); }
.card.done .check svg { stroke:#fff; stroke-dashoffset:0; }
.card.idle .check svg { stroke-dashoffset:0; opacity:.5; }
.card.miss .check { background:rgba(245,184,61,.12); border-color:rgba(245,184,61,.45); box-shadow:none; }
.card.miss .check svg { stroke:var(--amber); }
.card.pop .check svg { animation:draw .55s var(--ease) .15s backwards; }
@keyframes pulse { 0% { transform:scale(.9); opacity:.8; } 100% { transform:scale(1.22); opacity:0; } }
@keyframes draw { from { stroke-dashoffset:30; } to { stroke-dashoffset:0; } }

.body { min-width:0; cursor:pointer; }
.name { font:600 20px/1.2 var(--body); letter-spacing:-.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meta { display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:8px; align-items:center; }
.chip { font:500 12px var(--body); padding:4px 10px; border-radius:99px; background:rgba(66,115,209,.18); border:1px solid rgba(143,176,236,.25); color:#cfe0ff; }
.chip.fire { color:#ffd98a; border-color:rgba(245,184,61,.4); background:rgba(245,184,61,.12); }
.status { margin-top:8px; font-size:13.5px; color:var(--mut); }
.card.open .status { color:#ffd98a; }
.bar { height:8px; border-radius:5px; background:rgba(255,255,255,.1); margin-top:10px; overflow:hidden; }
.bar i { display:block; height:100%; border-radius:5px; background:linear-gradient(90deg, var(--amber), var(--blue-hi)); animation:grow 1.1s var(--ease); box-shadow:0 0 12px rgba(79,128,222,.6); }
@keyframes grow { from { width:0 !important; } }
.dots { display:flex; gap:4px; margin-top:10px; }
.dots i { width:9px; height:9px; border-radius:3px; background:rgba(255,255,255,.1); }
.dots i.y { background:var(--blue-hi); box-shadow:0 0 8px rgba(79,128,222,.7); }
.dots i.n { background:transparent; border:1.5px solid rgba(255,255,255,.25); }
.dots i.o { background:var(--amber); animation:blink 1.2s infinite; }
@keyframes blink { 50% { opacity:.35; } }

.empty { text-align:center; padding:40px 10px; color:var(--mut); }
.empty svg { width:120px; height:120px; margin-bottom:10px; }
.empty h3 { font:500 28px var(--body); letter-spacing:-.02em; color:var(--fg); margin:0 0 6px; }

/* FAB */
.fab { position:fixed; right:max(18px, calc(50% - 242px)); bottom:calc(22px + env(safe-area-inset-bottom)); z-index:20;
  height:58px; padding:0 26px 0 20px; border-radius:999px; background:linear-gradient(90deg,var(--blue-lo),var(--blue-hi)); color:#fff; border:1px solid rgba(255,255,255,.25) !important; display:flex; align-items:center; gap:8px;
  font:500 17px var(--body); box-shadow:0 0 30px rgba(66,115,209,.6), 0 10px 30px rgba(0,0,0,.4); animation:fabin .8s var(--spring) .4s backwards; }
.fab svg { width:22px; height:22px; stroke:currentColor; stroke-width:2.4; fill:none; stroke-linecap:round; }
@keyframes fabin { from { transform:translateY(100px) scale(.8); opacity:0; } }

/* sheets */
.backdrop { position:fixed; inset:0; z-index:40; background:rgba(3,6,15,.65); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); opacity:0; pointer-events:none; transition:opacity .35s; }
.backdrop.on { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:520px; margin:0 auto; max-height:88dvh; overflow:auto;
  background:linear-gradient(180deg,#0d1a3d,#070f26); border:1px solid var(--line); border-bottom:0; border-radius:32px 32px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px rgba(66,115,209,.2); transform:translateY(105%); transition:transform .6s var(--ease); }
.sheet.on { transform:none; }
.grab { width:40px; height:5px; border-radius:3px; background:rgba(255,255,255,.2); margin:0 auto 16px; }
.sheet h3 { font:500 30px/1.1 var(--body); letter-spacing:-.025em; margin:0 0 4px; }
.sheet .sub { color:var(--mut); margin:0 0 18px; font-size:14px; }
.btn { width:100%; height:54px; border-radius:999px; font:500 17px var(--body); background:rgba(255,255,255,.06); border:1px solid var(--line); margin-top:10px; }
.btn.pri { background:linear-gradient(90deg,var(--blue-lo),var(--blue-hi)); border:1px solid rgba(255,255,255,.25); box-shadow:0 0 30px rgba(66,115,209,.5); font-weight:600; color:#fff; }
.btn.dng { color:var(--bad); }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
label { display:block; font:500 12px var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin:16px 0 7px; }
input[type=text], input[type=number] { width:100%; height:52px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--fg); font:500 17px var(--body); padding:0 16px; outline:none; transition:border-color .2s, box-shadow .2s; }
input:focus { border-color:var(--blue-hi); box-shadow:0 0 0 3px rgba(79,128,222,.25); }
.emojis { display:flex; gap:8px; flex-wrap:wrap; }
.emojis button { width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.05); border:1px solid var(--line); font-size:22px; }
.emojis button.sel { border-color:var(--blue-hi); background:rgba(79,128,222,.25); transform:scale(1.1); box-shadow:0 0 16px rgba(79,128,222,.5); }

.stepper { display:flex; align-items:center; justify-content:center; gap:18px; margin:10px 0 6px; }
.stepper button { width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.06); border:1px solid var(--line); font:400 32px var(--body); }
.stepper .val { min-width:130px; text-align:center; }
.stepper .val b { display:block; font:500 80px/0.95 var(--body); letter-spacing:-.04em; background:linear-gradient(180deg,#fff,#8FB0EC); -webkit-background-clip:text; background-clip:text; color:transparent; }
.stepper .val span { color:var(--mut); font-size:14px; }

.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0 6px; }
.stat { background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:20px; padding:14px 10px; text-align:center; }
.stat b { display:block; font:500 34px/1 var(--body); letter-spacing:-.03em; }
.stat span { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); }
.hist { margin-top:12px; display:grid; gap:2px; }
.hist div { display:flex; justify-content:space-between; padding:11px 2px; border-bottom:1px solid var(--line); font-size:14px; }
.hist .ok { color:var(--acc); } .hist .miss { color:var(--mut); }
.copybox { word-break:break-all; font:13px/1.4 ui-monospace,monospace; background:rgba(255,255,255,.05); border:1px solid var(--line); padding:12px; border-radius:16px; color:#cfe0ff; }

/* toast */
.toast { position:fixed; left:50%; bottom:calc(100px + env(safe-area-inset-bottom)); z-index:60; transform:translate(-50%,30px); opacity:0; pointer-events:none;
  background:rgba(255,255,255,.96); color:#0b1736; padding:12px 18px; border-radius:999px; display:flex; gap:14px; align-items:center; font-weight:500; box-shadow:0 0 30px rgba(66,115,209,.5), 0 14px 40px rgba(0,0,0,.5); transition:all .5s var(--spring); white-space:nowrap; }
.toast.on { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
.toast button { color:#25438A; font-weight:700; }
#fx { position:fixed; inset:0; pointer-events:none; z-index:80; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
</style>
</head>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sleutel & API ---------- */
let KEY = localStorage.getItem('key');
const qk = new URLSearchParams(location.search).get('key');
if (qk) { KEY = qk; localStorage.setItem('key', qk); history.replaceState(null, '', '/'); }

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method, headers: { 'x-key': KEY || '', 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { localStorage.removeItem('key'); KEY = null; askKey(); throw new Error('401'); }
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* ---------- helpers ---------- */
const DAY = 864e5;
const fmtTime = (ts) => new Date(ts).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
const fmtDay = (ts) => {
  const d = new Date(ts), n = new Date(), s = (x) => new Date(x).setHours(0,0,0,0);
  const diff = Math.round((s(n) - s(d)) / DAY);
  if (diff === 0) return 'Vandaag'; if (diff === 1) return 'Gisteren';
  return d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
};

// Een ronde telt voor je reeks als hij is afgesloten en het doel gehaald is.
const hit = (e) => !!e.doneAt && e.met !== false;
function stats(t) {
  const h = t.history || [];
  let i = h.length - 1;
  if (i >= 0 && !h[i].doneAt && t.status === 'open') i--; // lopende ronde breekt je reeks nog niet
  let cur = 0; for (; i >= 0 && hit(h[i]); i--) cur++;
  let best = 0, run = 0;
  for (const e of h) { if (hit(e)) { run++; best = Math.max(best, run); } else run = 0; }
  const total = h.filter(hit).length;
  const amount = h.reduce((a, e) => a + (e.amount || 0), 0);
  const last = h[h.length - 1];
  const doneRecent = !!(last && last.doneAt && t.status !== 'open' && Date.now() - last.doneAt < 18 * 3600e3);
  const miss = doneRecent && last.met === false;
  return { cur, best, total, amount, last, doneRecent, miss };
}

function countUp(el, to, ms = 900) {
  if (reduced) { el.textContent = to; return; }
  const from = Number(el.dataset.v || 0), t0 = performance.now();
  el.dataset.v = to;
  const step = (t) => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- state & render ---------- */
let tasks = [], firstRender = true, popId = null;

const getName = () => { try { return localStorage.getItem('name') ?? 'Djaylan'; } catch { return 'Djaylan'; } };
function greeting() {
  const h = new Date().getHours(), n = getName().trim();
  // 00-05 nacht, 05-12 ochtend, 12-18 middag, 18-24 avond
  const g = h < 5 ? 'Goedenacht' : h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond';
  return esc(g) + (n ? `,<br><em>${esc(n)}</em>` : '');
}

function render() {
  $('#date').textContent = new Date().toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#greet').innerHTML = greeting();

  const S = tasks.map((t) => ({ t, s: stats(t) }));
  const open = S.filter((x) => x.t.status === 'open').length;
  const done = S.filter((x) => x.s.doneRecent).length;
  const denom = open + done;
  const frac = denom ? done / denom : 0;
  $('#ringfg').style.strokeDashoffset = 238.8 * (1 - frac);
  countUp($('#ringnum'), open || done);
  const T = $('#heroT'), P = $('#heroP');
  if (!tasks.length) { T.textContent = 'Nog niks gepland'; P.textContent = 'Voeg je eerste gewoonte toe.'; $('#ringnum').textContent = '–'; }
  else if (open) { T.textContent = open === 1 ? 'Nog 1 te doen' : `Nog ${open} te doen`; P.textContent = 'Tik op de cirkel zodra het gedaan is.'; }
  else if (done) { T.textContent = 'Alles gedaan'; P.textContent = 'Sterk. Rust maar uit tot je volgende wake-up.'; }
  else { T.textContent = 'Rustig aan'; P.textContent = 'Je melding komt zodra je wekker uitgaat.'; }

  const list = $('#list');
  if (!tasks.length) {
    list.innerHTML = `<div class="empty"><svg viewBox="0 0 120 120" fill="none" stroke="#4F80DE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="60" r="46" stroke="rgba(255,255,255,.12)" stroke-width="8"/><path d="M38 62l15 15 30-34"/></svg><h3>Begin vandaag</h3><div>Een gewoonte, een melding, geen excuses.</div></div>`;
    return;
  }
  list.innerHTML = S.map(({ t, s }, i) => {
    const st = t.status === 'open' ? 'open' : s.doneRecent ? 'done' : 'idle';
    const recent = (t.history || []).slice(-10);
    const dots = recent.map((e, j) => `<i class="${hit(e) ? 'y' : (j === recent.length - 1 && t.status === 'open') ? 'o' : 'n'}"></i>`).join('');
    const u = t.unit ? ' ' + esc(t.unit) : '';
    const r = s.last, g = r && r.goal;
    const status = st === 'open'
      ? (r.amount ? `${r.amount}${g ? ' van ' + g : ''}${u} gelogd${g ? ' · nog ' + Math.max(0, g - r.amount) : ''}` : `Wacht op je sinds ${fmtTime(r.firedAt)}`)
      : st === 'done' ? (s.miss ? `Afgerond om ${fmtTime(r.doneAt)} · ${r.amount} van ${r.goal}${u}`
          : `Gedaan om ${fmtTime(r.doneAt)}${r.amount ? ' · ' + r.amount + (g ? '/' + g : '') + u : ''}`)
      : r ? `Laatst gedaan ${fmtDay(r.doneAt || r.firedAt).toLowerCase()}` : 'Wacht op je eerste wake-up';
    const bar = st === 'open' && g ? `<div class="bar"><i style="width:${Math.min(100, Math.round(((r.amount || 0) / g) * 100))}%"></i></div>` : '';
    return `<article class="card ${st}${s.miss ? ' miss' : ''}${popId === t.id ? ' pop' : ''}" style="--i:${firstRender ? i : 0}" data-id="${t.id}">
      <button class="check" data-act="check" aria-label="Markeer ${esc(t.name)} als gedaan"><svg viewBox="0 0 30 30"><path d="M6 16l6 6 12-14"/></svg></button>
      <div class="body" data-act="detail">
        <div class="name">${t.emoji ? esc(t.emoji) + ' ' : ''}${esc(t.name)}</div>
        <div class="meta">${g || t.goal ? `<span class="chip">Doel ${g || t.goal}${u}</span>` : ''}${t.nextGoal ? `<span class="chip">Volgende: ${t.nextGoal}</span>` : ''}${s.cur ? `<span class="chip fire">🔥 ${s.cur} op rij</span>` : ''}</div>
        <div class="status">${status}</div>${bar}
        <div class="dots">${dots}</div>
      </div></article>`;
  }).join('');
  firstRender = false; popId = null;
}

async function load() { tasks = await api('/tasks'); render(); }

/* ---------- sheets ---------- */
const sheet = $('#sheet'), bd = $('#bd');
function openSheet(html, after) { sheet.innerHTML = '<div class="grab"></div>' + html; sheet.scrollTop = 0; bd.classList.add('on'); requestAnimationFrame(() => sheet.classList.add('on')); after && after(); }
function closeSheet() { sheet.classList.remove('on'); bd.classList.remove('on'); }
bd.onclick = closeSheet;
let dragY = null;
sheet.addEventListener('touchstart', (e) => { if (sheet.scrollTop <= 0) dragY = e.touches[0].clientY; }, { passive: true });
sheet.addEventListener('touchmove', (e) => { if (dragY == null) return; const d = e.touches[0].clientY - dragY; if (d > 0) { sheet.style.transition = 'none'; sheet.style.transform = `translateY(${d}px)`; } }, { passive: true });
sheet.addEventListener('touchend', (e) => { if (dragY == null) return; const d = e.changedTouches[0].clientY - dragY; sheet.style.transition = ''; sheet.style.transform = ''; if (d > 110) closeSheet(); dragY = null; });

function askKey() {
  openSheet(`<h3>Sleutel nodig</h3><p class="sub">Plak je persoonlijke sleutel om je gewoontes te openen.</p><label>Sleutel</label><input type="text" id="k" autocapitalize="off" autocomplete="off"><button class="btn pri" id="kok">Openen</button>`,
    () => { $('#kok').onclick = () => { KEY = $('#k').value.trim(); localStorage.setItem('key', KEY); closeSheet(); load().catch(() => {}); }; });
}

function formSheet(t) {
  const E = ['💪','🏃','🧘','📖','💧','🥗','😴','✍️'];
  let emoji = t?.emoji || '';
  openSheet(`<h3>${t ? 'Aanpassen' : 'Nieuwe gewoonte'}</h3><p class="sub">Wat ga je elke wake-up doen?</p>
    <label>Kies een icoon</label><div class="emojis">${E.map((e) => `<button type="button" data-e="${e}" class="${e === emoji ? 'sel' : ''}">${e}</button>`).join('')}</div>
    <label>Naam</label><input type="text" id="fname" maxlength="80" placeholder="Push-ups" value="${esc(t?.name || '')}">
    <div class="row2"><div><label>Standaarddoel</label><input type="number" id="fgoal" inputmode="numeric" min="1" placeholder="30" value="${t?.goal || ''}"></div>
    <div><label>Eenheid</label><input type="text" id="funit" maxlength="20" placeholder="herhalingen" value="${esc(t?.unit || '')}"></div></div>
    <button class="btn pri" id="fsave">${t ? 'Opslaan' : 'Toevoegen'}</button>${t ? '<button class="btn dng" id="fdel">Verwijderen</button>' : ''}`,
    () => {
      sheet.querySelectorAll('[data-e]').forEach((b) => b.onclick = () => { emoji = emoji === b.dataset.e ? '' : b.dataset.e; sheet.querySelectorAll('[data-e]').forEach((x) => x.classList.toggle('sel', x.dataset.e === emoji)); });
      $('#fsave').onclick = async () => {
        const body = { name: $('#fname').value, goal: $('#fgoal').value, unit: $('#funit').value, emoji };
        if (!body.name.trim()) { $('#fname').focus(); return; }
        await api(t ? '/tasks/' + t.id : '/tasks', t ? 'PATCH' : 'POST', body); closeSheet(); load();
      };
      if (t) $('#fdel').onclick = async () => { if (confirm(`"${t.name}" en alle geschiedenis verwijderen?`)) { await api('/tasks/' + t.id, 'DELETE'); closeSheet(); load(); } };
    });
}

// Log-sheet: voeg een (deel)aantal toe aan de lopende ronde.
function logSheet(t, originEl) {
  const s = stats(t), open = t.status === 'open' && s.last && !s.last.doneAt;
  const goal = open ? s.last.goal : (t.nextGoal || t.goal), have = open ? s.last.amount || 0 : 0;
  const left = goal ? Math.max(0, goal - have) : 0;
  let n = left || 1;
  const step = (goal || 0) >= 100 ? 10 : (goal || 0) >= 40 ? 5 : 1;
  openSheet(`<h3>${esc(t.name)}</h3>
    <p class="sub">${goal ? `Doel ${goal}${t.unit ? ' ' + esc(t.unit) : ''} · al ${have} gelogd${left ? ' · nog ' + left : ''}` : 'Hoeveel heb je gedaan?'}</p>
    <div class="stepper"><button id="m" aria-label="Minder">−</button><div class="val"><b id="n">${n}</b><span>${esc(t.unit || 'keer')}</span></div><button id="p" aria-label="Meer">+</button></div>
    <button class="btn pri" id="ok">${goal && n < left ? 'Loggen' : 'Gedaan'} ✓</button>
    ${goal && have + 1 < goal ? '<button class="btn" id="fin">Loggen en dag afronden</button>' : ''}`,
    () => {
      const upd = () => { $('#n').textContent = n; $('#ok').textContent = (goal && have + n < goal ? 'Loggen' : 'Gedaan') + ' ✓'; };
      $('#m').onclick = () => { n = Math.max(1, n - step); upd(); };
      $('#p').onclick = () => { n += step; upd(); };
      $('#ok').onclick = () => { closeSheet(); complete(t, n, false, originEl); };
      if ($('#fin')) $('#fin').onclick = () => { closeSheet(); complete(t, n, true, originEl); };
    });
}

function detailSheet(t) {
  const s = stats(t), h = [...(t.history || [])].reverse().slice(0, 12);
  openSheet(`<h3>${t.emoji ? esc(t.emoji) + ' ' : ''}${esc(t.name)}</h3><p class="sub">${t.goal ? `Doel: ${t.goal} ${esc(t.unit)}` : 'Geen vast doel'}</p>
    <div class="stats"><div class="stat"><b>${s.cur}</b><span>Op rij</span></div><div class="stat"><b>${s.best}</b><span>Record</span></div><div class="stat"><b>${s.total}</b><span>Totaal</span></div></div>
    ${s.amount ? `<p class="sub" style="text-align:center;margin:8px 0 0">In totaal <b style="color:var(--acc)">${s.amount}</b> ${esc(t.unit)}</p>` : ''}
    <label>Doel voor de volgende ronde</label>
    <div class="row2" style="grid-template-columns:1fr auto"><input type="number" id="ng" inputmode="numeric" min="1" placeholder="${t.goal || 'Geen doel'}" value="${t.nextGoal || ''}"><button class="btn" id="ngs" style="width:auto;margin:0;padding:0 20px;height:52px;font-size:18px">Zet</button></div>
    <p class="sub" style="margin:6px 0 0;font-size:12px">Geldt voor je eerstvolgende wake-up. Leeg laten = standaarddoel${t.goal ? ' (' + t.goal + ')' : ''}.</p>
    <div class="hist">${h.length ? h.map((e) => {
      const live = !e.doneAt && t.status === 'open' && e === t.history[t.history.length - 1];
      const amt = e.amount ? `${e.amount}${e.goal ? '/' + e.goal : ''}${t.unit ? ' ' + esc(t.unit) : ''}` : '';
      const cls = hit(e) ? 'ok' : live ? '' : 'miss';
      const txt = hit(e) ? '✓ ' + (amt || 'gedaan') : live ? 'bezig ' + amt : e.doneAt ? '✗ ' + amt : 'gemist';
      return `<div><span>${fmtDay(e.firedAt)} · ${fmtTime(e.firedAt)}</span><span class="${cls}">${txt}</span></div>`; }).join('') : '<div><span>Nog geen geschiedenis</span></div>'}</div>
    <button class="btn pri" id="more">+ Nu loggen</button>
    ${s.last && (s.last.doneAt || (s.last.logs || []).length) ? '<button class="btn" id="undo">Laatste log ongedaan maken</button>' : ''}
    <button class="btn" id="edit">Aanpassen</button>`,
    () => {
      $('#more').onclick = () => { closeSheet(); setTimeout(() => (t.goal || t.nextGoal || (s.last && s.last.goal && t.status === 'open') ? logSheet(t) : complete(t, null, true)), 250); };
      $('#ngs').onclick = async () => { await api(`/tasks/${t.id}/next-goal`, 'POST', { goal: $('#ng').value }); closeSheet(); toast($('#ng').value ? `Volgende ronde: ${$('#ng').value}` : 'Standaarddoel hersteld'); load(); };
      if ($('#undo')) $('#undo').onclick = async () => { await api(`/tasks/${t.id}/undo`, 'POST'); closeSheet(); load(); };
      $('#edit').onclick = () => { closeSheet(); setTimeout(() => formSheet(t), 250); };
    });
}

function settingsSheet() {
  const link = `${location.origin}/wakker?key=${KEY}`;
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  openSheet(`<h3>Instellingen</h3><p class="sub">Meldingen en je wake-up link.</p>
    <label>Je naam</label><input type="text" id="nm" maxlength="30" value="${esc(getName())}">
    <label>Meldingen</label>
    <button class="btn" id="en">${perm === 'granted' ? 'Meldingen staan aan ✓' : 'Meldingen aanzetten'}</button>
    <button class="btn" id="test">Stuur testmelding</button>
    <label>Wake-up link (voor Opdrachten)</label><div class="copybox" id="lnk">${esc(link)}</div>
    <button class="btn" id="copy">Kopieer link</button>
    <button class="btn dng" id="out">Uitloggen op dit toestel</button>`,
    () => {
      $('#nm').onchange = () => { try { localStorage.setItem('name', $('#nm').value.trim()); } catch {} render(); };
      $('#en').onclick = async () => { await enablePush(); settingsSheet(); };
      $('#test').onclick = async () => { const r = await api('/test', 'POST'); toast(r.apparaten ? 'Testmelding verstuurd' : 'Nog geen toestel gekoppeld, zet meldingen aan'); };
      $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('Link gekopieerd'); } catch { toast('Houd de link ingedrukt om te kopiëren'); } };
      $('#out').onclick = () => { localStorage.removeItem('key'); location.reload(); };
    });
}

/* ---------- afvinken + effecten ---------- */
let undoTimer;
function toast(msg, undoFn) {
  const el = $('#toast'); clearTimeout(undoTimer);
  el.innerHTML = `<span>${esc(msg)}</span>${undoFn ? '<button id="tu">Ongedaan</button>' : ''}`;
  el.classList.add('on');
  if (undoFn) $('#tu').onclick = () => { el.classList.remove('on'); undoFn(); };
  undoTimer = setTimeout(() => el.classList.remove('on'), undoFn ? 6000 : 2600);
}

async function complete(t, amount, finish, originEl) {
  const el = originEl || document.querySelector(`[data-id="${t.id}"] .check`);
  const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const undo = async () => { await api(`/tasks/${t.id}/undo`, 'POST'); load(); };
  const res = await api(`/tasks/${t.id}/log`, 'POST', { amount, finish });
  const last = res.history[res.history.length - 1];
  const closed = !!last.doneAt;
  if (closed) popId = t.id;
  await load();
  navigator.vibrate && navigator.vibrate(closed ? [30, 40, 60] : 25);
  if (closed && last.met !== false) {
    confetti(r.left + r.width / 2, r.top + r.height / 2);
    const s = stats(tasks.find((x) => x.id === t.id));
    toast(s.cur > 1 ? `Doel gehaald 🔥 ${s.cur} op rij` : 'Doel gehaald. Lekker bezig.', undo);
  } else if (closed) toast(`Afgerond: ${last.amount} van ${last.goal}. Morgen beter.`, undo);
  else toast(`${last.amount} van ${last.goal} gelogd. Nog ${last.goal - last.amount} te gaan.`, undo);
}

const fx = $('#fx'), cx = fx.getContext('2d');
function confetti(x, y) {
  if (reduced) return;
  const dpr = devicePixelRatio || 1; fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; cx.scale(dpr, dpr);
  const cols = ['#4F80DE', '#ffffff', '#F5B83D', '#8FB0EC'];
  const ps = Array.from({ length: 80 }, () => { const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
    return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .5, c: cols[(Math.random() * cols.length) | 0] }; });
  const t0 = performance.now();
  (function frame(t) {
    const k = (t - t0) / 1500; cx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach((p) => { p.vy += .35; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.globalAlpha = Math.max(0, 1 - k); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    if (k < 1) requestAnimationFrame(frame); else cx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ---------- events ---------- */
$('#list').addEventListener('click', (e) => {
  const card = e.target.closest('.card'); if (!card) return;
  const t = tasks.find((x) => x.id === card.dataset.id); if (!t) return;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'check') {
    if (card.classList.contains('done')) return detailSheet(t);
    const s = stats(t), g = (t.status === 'open' && s.last && s.last.goal) || t.nextGoal || t.goal;
    g ? logSheet(t, card.querySelector('.check')) : complete(t, null, true, card.querySelector('.check'));
  } else detailSheet(t);
});
$('#fab').onclick = () => formSheet();
$('#gear').onclick = settingsSheet;

/* ---------- push ---------- */
const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { toast('Voeg de app eerst toe aan je beginscherm'); return; }
  const reg = await navigator.serviceWorker.register('/sw.js');
  if (await Notification.requestPermission() !== 'granted') { toast('Meldingen zijn geweigerd in Instellingen van iOS'); return; }
  const { publicKey } = await fetch('/api/vapid').then((r) => r.json());
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(publicKey) });
  await api('/subscribe', 'POST', sub);
  toast('Meldingen staan aan');
}
async function syncPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const reg = await navigator.serviceWorker.register('/sw.js');
  const sub = await reg.pushManager.getSubscription();
  if (sub && Notification.permission === 'granted') await api('/subscribe', 'POST', sub);
  else if (Notification.permission === 'default') setTimeout(() => toast('Zet meldingen aan via ⚙'), 1500);
}

/* ---------- start ---------- */
if (!KEY) askKey(); else { load().catch(() => {}); syncPush().catch(() => {}); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && KEY) load().catch(() => {}); });
setInterval(() => { if (!document.hidden && KEY) load().catch(() => {}); }, 30000);
</script>
